# .github/workflows/docs_validation.yml
name: Documentation Validation

on:
  push:
    branches: [ main, master ]
    paths:
      - '**/*.md'
      - '**/*.markdown'
      - '.github/workflows/docs_validation.yml'
      - 'infrastructure/.docs_validator.toml'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**/*.md'
      - '**/*.markdown'
      - '.github/workflows/docs_validation.yml'
      - 'infrastructure/.docs_validator.toml'
  workflow_dispatch:

jobs:
  validate-docs:
    name: Validate Markdown Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
#          cache: 'pip'

      - name: Install docs_validator
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/Nokhrin/docs-validator.git

      - name: Run documentation validation
        run: |
          echo "Starting documentation validation..."
          docs_validator scan . \
            --config infrastructure/.docs_validator.toml \
            --validate \
            --fail-on-error \
            --report markdown \
            --output docs-validation-report.md

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-validation-report
          path: docs-validation-report.md
          retention-days: 7